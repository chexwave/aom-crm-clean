<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>American Outboard Motors — CRM Core</title>
  <link rel="stylesheet" href="styles.css?v=collapsible1">
</head>
<body>
<header>
  <button id="sidebarToggle" class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
  <h1>American Outboard <span>CRM</span> <span id="appVersion" style="font-size:0.75rem;font-weight:600;color:#fff;opacity:0.85;margin-left:0.5rem">v2.7</span></h1>
  <div class="header-search">
    <input type="text" id="globalSearch" placeholder="Search customers, parts, jobs..." onkeyup="handleGlobalSearch(this.value)">
  </div>
  <nav>
    <button class="secondary" onclick="exportData()">Export</button>
    <button class="secondary" onclick="resetSeed()">Reset Seed</button>
  </nav>
</header>

<aside class="sidebar collapsed" id="sidebar">
  <button id="side-home" onclick="show('home')" title="Home">Home</button>
  <button id="side-board" onclick="show('board')" title="Jobs">Jobs</button>
  <button id="side-customers" onclick="show('customers')" title="Customers">Customers</button>
  <button id="side-parts" onclick="show('parts')" title="Parts">Parts</button>
  <button id="side-more" onclick="toggleMoreMenu()" title="More">More</button>
  <div id="moreMenu" class="more-menu" style="display:none">
    <button onclick="show('company'); toggleMoreMenu()">Company</button>
    <button onclick="show('archive'); toggleMoreMenu()">Archive</button>
    <button onclick="alert('Timesheet coming')">Timesheet</button>
    <button onclick="alert('Calendar coming')">Calendar</button>
  </div>
</aside>

<main id="app"></main>

<div class="bottom-nav">
  <button id="nav-home" onclick="show('home')">Home</button>
  <button id="nav-company" onclick="show('company')">Company</button>
  <button id="nav-add" onclick="toggleAddMenu()">ADD +</button>
  <button id="nav-board" onclick="show('board')">Jobs</button>
  <button id="nav-archive" onclick="show('archive')">Archive</button>
</div>

<div id="addMenu" style="display:none;position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#002868;color:#fff;border-radius:10px;padding:0.6rem;box-shadow:0 4px 16px rgba(0,0,0,0.3);z-index:100;min-width:180px">
  <button class="btn" style="display:block;width:100%;margin-bottom:0.3rem;background:#fff;color:#002868;border:none" onclick="show('new');toggleAddMenu()">New Estimate</button>
  <button class="btn" style="display:block;width:100%;margin-bottom:0.3rem;background:#fff;color:#002868;border:none" onclick="show('newcustomer');toggleAddMenu()">New Customer</button>
  <button class="btn" style="display:block;width:100%;margin-bottom:0.3rem;background:#fff;color:#002868;border:none" onclick="show('newpart');toggleAddMenu()">New Part</button>
  <button class="btn" style="display:block;width:100%;margin-bottom:0.3rem;background:#fff;color:#002868;border:none" onclick="show('newboat');toggleAddMenu()">New Boat</button>
  <button class="btn" style="display:block;width:100%;background:#fff;color:#002868;border:none" onclick="show('newmotor');toggleAddMenu()">New Motor</button>
</div>

<script src="app.js?v=collapsible1"></script>
<script>
function toggleMoreMenu() {
  const m = document.getElementById('moreMenu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
}
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  document.body.classList.toggle('sidebar-collapsed');
}
function handleGlobalSearch(q) {
  if (!q || q.length < 2) return;
  const lower = q.toLowerCase();
  const cust = (typeof customers !== 'undefined') && customers.find(c => (c.name || '').toLowerCase().includes(lower));
  if (cust) { show('customer', cust.id); return; }
  const part = (typeof parts !== 'undefined') && parts.find(p => (p.productName || p.sku || p.description || '').toLowerCase().includes(lower));
  if (part) { show('part', part.id); return; }
  show('customers');
}
</script>
</body>
</html>
